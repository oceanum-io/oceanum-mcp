[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oceanum-mcp"
version = "0.6.0"
description = "MCP servers for the Oceanum platform"
readme = "README.md"
license = "MIT"
# <3.14: numcodecs<0.16 (below) ships no cp314 wheels, so 3.14 falls back to a
# source build that fails (e.g. c-blosc vs GCC 15's C23 default); the first
# cp314 numcodecs (0.16.4) can't be used because no zarr 2.x release imports
# with it. uv ignores this upper bound when resolving, so uvx users still need
# `--python 3.13` (see README). Lift together with the numcodecs pin.
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastmcp>=4.0,<5",
    # Imported directly by common.auth. FastMCP 4 moved its HTTP stack from
    # httpx to httpx2, so httpx is no longer installed transitively.
    "httpx2>=2.5,<3",
    # <2 pin guards the private Connector._stage_request/Session usage in the
    # datamesh server's staging helper (no public staging API in oceanum 1.x).
    # >=1.2.1: the first release to pin xarray<2026.9. Later xarray drops
    # zarr 2 support (passes zarr_format= to zarr.open_group, which the
    # zarr<3 oceanum requires rejects), so every gridded load failed on
    # images that resolved oceanum<1.2.1 with xarray>=2026.9 (OCE-354).
    "oceanum>=1.2.1,<2",
    # zarr<3 via oceanum; xarray>=2026.9 always passes zarr_format= (OCE-354).
    "xarray<2026.9",
    # oceanum requires zarr<3, and zarr 2.x breaks at runtime with
    # numcodecs>=0.16 (blosc.cbuffer_sizes removed); oceanum does not pin this.
    # Remove once oceanum pins numcodecs itself or moves to zarr>=3.
    "numcodecs<0.16",
]

[project.optional-dependencies]
# OS credential-store token lookup (DATAMESH_TOKEN_KEYRING), imported lazily.
keyring = ["keyring>=25"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # The keyring tests import it; declared so they never rely on it arriving
    # transitively.
    "keyring>=25",
]

[project.scripts]
oceanum-mcp = "oceanum_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oceanum_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
