name: Build and test the library

on:
  push:

jobs:
  build-and-test:
    name: Build and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13+ dedents docstrings at compile time, which changes how FastMCP
        # parses tool docstrings (OCE-331); test both ends of the range.
        python-version: ['3.10', '3.13']
    env:
      DATAMESH_TOKEN: ${{ secrets.DATAMESH_TOKEN }}
    steps:
    -
      name: Checkout repo
      uses: actions/checkout@v4
    -
      name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    -
      name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[dev]'
    -
      name: Test
      run: pytest -s -v tests
